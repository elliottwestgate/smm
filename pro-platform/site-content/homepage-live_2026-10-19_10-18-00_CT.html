;220&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; fill=&quot;white&quot; font-family=&quot;Arial&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;Brand&lt;/text&gt;&lt;path d=&quot;M220 23 V5 M214 11 L220 5 L226 11 M264 60 H289 M283 54 L289 60 L283 66&quot; fill=&quot;none&quot; stroke=&quot;#074b78&quot; stroke-width=&quot;2&quot;/&gt;&lt;/svg&gt;&lt;div class=&quot;snapshot-labels&quot;&gt;&lt;span&gt;Website&lt;/span&gt;&lt;span&gt;Social&lt;/span&gt;&lt;span&gt;Email&lt;/span&gt;&lt;span&gt;Goal events&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;See what is moving your Brand.&lt;/h2&gt;&lt;p&gt;Bring your reporting into one shared workspace. Compare performance, see your Brand’s direction in the Matrix, and turn the results into focused content recommendations.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Traffic, audience and goal-event comparisons&lt;/li&gt;&lt;li&gt;Connected website, social and email reporting&lt;/li&gt;&lt;li&gt;Pro Analytics Review with clear Moves to Make&lt;/li&gt;&lt;/ul&gt;&lt;a class=&quot;snapshot-link&quot; href=&quot;https://socialmediamagnetpro.com/pro-analytics-overview/&quot;&gt;Explore the Pro Analytics Overview &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/a&gt;&lt;/article&gt;&lt;article class=&quot;overview-snapshot campaign-snapshot&quot;&gt;&lt;div class=&quot;snapshot-top&quot;&gt;&lt;span class=&quot;snapshot-kicker&quot;&gt;LIVE CAMPAIGN&lt;/span&gt;&lt;span class=&quot;snapshot-tag&quot;&gt;Learn · Build · Apply&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;snapshot-visual campaign-visual&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;b&gt;Brand&lt;/b&gt;&lt;span&gt;Story · Promise&lt;br&gt;Beliefs · Trust&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;b&gt;Message Matrix&lt;/b&gt;&lt;span&gt;Audiences&lt;br&gt;Content focus&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;b&gt;Live Campaign&lt;/b&gt;&lt;span&gt;Calendar&lt;br&gt;Channels · Results&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;Build the campaign your business needs.&lt;/h2&gt;&lt;p&gt;Put the Social Media Magnet framework to work as you learn. Connect your Brand foundation to your Message Matrix, publishing calendar and customer experience.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Practical courseware and digital textbook&lt;/li&gt;&lt;li&gt;Guided assignments applied to your business&lt;/li&gt;&lt;li&gt;A connected campaign you can implement and improve&lt;/li&gt;&lt;/ul&gt;&lt;a class=&quot;snapshot-link&quot; href=&quot;https://socialmediamagnetpro.com/live-campaign-overview/&quot;&gt;Explore the Live Campaign Overview &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&#10;&lt;div class=&quot;proof&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;proof-grid&quot;&gt;&lt;p&gt;A working business framework.&lt;br&gt;A practical path to results.&lt;/p&gt;&lt;div&gt;&lt;strong&gt;Proven in business.&lt;/strong&gt;&lt;span&gt;Applied in live company campaigns&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Taught in universities.&lt;/strong&gt;&lt;span&gt;Including Belmont and Penn State&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;1,000+ participants.&lt;/strong&gt;&lt;span&gt;Through the SMM program&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#10;&lt;section class=&quot;brand-statement section&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;Start where the business starts&lt;/p&gt;&lt;h2&gt;Your Brand is the foundation.&lt;br&gt;Your customers feel the difference.&lt;/h2&gt;&lt;p class=&quot;brand-intro&quot;&gt;Your culture. Your decisions. The promises your team keeps. The experience customers share. These give your Brand meaning—and give people a reason to choose you.&lt;/p&gt;&lt;div class=&quot;brand-pillars&quot;&gt;&lt;article&gt;&lt;span&gt;01&lt;/span&gt;&lt;h3&gt;Brand Story&lt;/h3&gt;&lt;p&gt;Make clear who you are and why your business matters.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02&lt;/span&gt;&lt;h3&gt;Brand Promise&lt;/h3&gt;&lt;p&gt;Tell customers what to expect. Deliver it consistently.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;03&lt;/span&gt;&lt;h3&gt;Brand Beliefs&lt;/h3&gt;&lt;p&gt;Let your values guide the team, the message and the experience.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;04&lt;/span&gt;&lt;h3&gt;Brand Trust&lt;/h3&gt;&lt;p&gt;Earn confidence by making the experience live up to the message.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;p class=&quot;brand-close&quot;&gt;Put that foundation into every message, every channel and every customer relationship.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&#10;&lt;section class=&quot;section&quot; id=&quot;analytics&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;Choose the solution you need now&lt;/p&gt;&lt;h2&gt;Build it with purpose.&lt;br&gt;Improve it with evidence.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;One SMM framework connects the two: your Brand at the center, a coordinated campaign around it, and results that guide what happens next.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path-grid&quot;&gt;&lt;article class=&quot;path feature&quot;&gt;&lt;div class=&quot;index&quot;&gt;For business owners &amp; teams &lt;span&gt;PRO ANALYTICS&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;Find what connects.&lt;br&gt;Know what to change.&lt;/h3&gt;&lt;p&gt;Getting attention but unsure what it produces? Bring your website, social and email performance into focus. See your Brand’s movement in the Matrix and request a Pro Analytics Review with specific Moves to Make.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;See traffic, audiences and goal events across selected dates&lt;/li&gt;&lt;li&gt;Use content signals to develop, reframe and create messages&lt;/li&gt;&lt;li&gt;Give your team one shared view of the results&lt;/li&gt;&lt;/ul&gt;&lt;a class=&quot;arrow-link&quot; href=&quot;https://socialmediamagnetpro.com/pro-analytics-overview/&quot;&gt;Explore Pro Analytics &lt;span&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;svg class=&quot;path-art&quot; viewBox=&quot;0 0 100 60&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M50 30 C0 -5 0 65 50 30 C100 -5 100 65 50 30&quot; fill=&quot;none&quot; stroke=&quot;white&quot; stroke-width=&quot;3&quot;/&gt;&lt;/svg&gt;&lt;/article&gt;&lt;article class=&quot;path&quot; id=&quot;program&quot;&gt;&lt;div class=&quot;index&quot;&gt;For learners &amp; businesses &lt;span&gt;LIVE CAMPAIGN&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;Build a campaign.&lt;br&gt;Grow the capability.&lt;/h3&gt;&lt;p&gt;Need a working campaign and a team that knows how to run it? Apply the SMM framework to your business as you learn. Build your Brand foundation, Message Matrix and publishing calendar—then put the campaign to work.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Follow a practical path from Brand foundation to implementation&lt;/li&gt;&lt;li&gt;Connect audiences, content topics and channels through the Message Matrix&lt;/li&gt;&lt;li&gt;Measure the response and keep dialing in your message&lt;/li&gt;&lt;/ul&gt;&lt;a class=&quot;arrow-link&quot; href=&quot;https://socialmediamagnetpro.com/live-campaign/&quot;&gt;Discover Live Campaign &lt;span&gt;→&lt;/span&gt;&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&#10;&lt;section class=&quot;section model&quot; id=&quot;model&quot;&gt;&lt;div class=&quot;wrap model-grid&quot;&gt;&lt;div class=&quot;model-diagram&quot;&gt;&lt;div class=&quot;orbit&quot;&gt;&lt;/div&gt;&lt;div class=&quot;hub-tag top&quot;&gt;&lt;strong&gt;Useful content&lt;/strong&gt;&lt;span&gt;A reason to pay attention&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hub-tag left&quot;&gt;&lt;strong&gt;Social discovery&lt;/strong&gt;&lt;span&gt;Bring people in&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 480 250&quot; role=&quot;img&quot; aria-label=&quot;The Social Media Magnet loop connects acquisition and retention around the Brand hub&quot;&gt;&lt;path d=&quot;M240 125 C24 -18 15 268 240 125 C465 -18 456 268 240 125&quot; fill=&quot;none&quot; stroke=&quot;#d3e7f1&quot; stroke-width=&quot;19&quot;/&gt;&lt;path d=&quot;M240 125 C24 -18 15 268 240 125 C465 -18 456 268 240 125&quot; fill=&quot;none&quot; stroke=&quot;#0071bc&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;240&quot; cy=&quot;125&quot; r=&quot;48&quot; fill=&quot;#074b78&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial,sans-serif&quot; font-size=&quot;18&quot; fill=&quot;white&quot; font-weight=&quot;700&quot;&gt;Your Brand&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;141&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial,sans-serif&quot; font-size=&quot;9&quot; fill=&quot;#b7def0&quot;&gt;THE HUB&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;hub-tag right&quot;&gt;&lt;strong&gt;Email return&lt;/strong&gt;&lt;span&gt;Bring people back&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hub-tag bottom&quot;&gt;&lt;strong&gt;Goal events&lt;/strong&gt;&lt;span&gt;Turn attention into action&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;model-copy&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;The Social Media Magnet&lt;/p&gt;&lt;h2&gt;Put your Brand&lt;br&gt;at the center of the campaign.&lt;/h2&gt;&lt;p&gt;The Brand Hub anchors your story, promises and beliefs. Your website carries that story into useful content. Social channels attract people to it. Email gives them a reason to return. Each has a role in building trust and moving customers closer to your Brand.&lt;/p&gt;&lt;p&gt;The Message Matrix connects the audiences you serve with the topics they care about. Your publishing calendar turns that direction into a dimensional messaging campaign: one Brand narrative, expressed with purpose across the channels.&lt;/p&gt;&lt;a href=&quot;https://socialmediamagnetpro.com/pro-analytics-overview/&quot;&gt;See the model in Pro Analytics &lt;span&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;div class=&quot;model-line&quot;&gt;&lt;div&gt;&lt;strong&gt;Acquire&lt;/strong&gt;&lt;br&gt;&lt;span&gt;Earn attention&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Engage&lt;/strong&gt;&lt;br&gt;&lt;span&gt;Deliver value&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Retain&lt;/strong&gt;&lt;br&gt;&lt;span&gt;Create a reason to return&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&#10;&lt;section class=&quot;section focus-section&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;A clearer direction for your content&lt;/p&gt;&lt;h2&gt;Stop filling the calendar.&lt;br&gt;Start building the connection.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Pro Analytics Review brings performance back to content direction: what to develop, what to reframe and what to create next. Your team makes the publishing decisions.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;focus-grid&quot;&gt;&lt;article class=&quot;focus-block&quot;&gt;&lt;svg viewBox=&quot;0 0 100 60&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;68&quot; cy=&quot;29&quot; r=&quot;26&quot; fill=&quot;#edf7fc&quot;/&gt;&lt;rect x=&quot;14&quot; y=&quot;35&quot; width=&quot;12&quot; height=&quot;20&quot; rx=&quot;2&quot; fill=&quot;#29abe2&quot;/&gt;&lt;rect x=&quot;34&quot; y=&quot;25&quot; width=&quot;12&quot; height=&quot;30&quot; rx=&quot;2&quot; fill=&quot;#29abe2&quot;/&gt;&lt;rect x=&quot;54&quot; y=&quot;15&quot; width=&quot;12&quot; height=&quot;40&quot; rx=&quot;2&quot; fill=&quot;#29abe2&quot;/&gt;&lt;path d=&quot;M13 25 L36 11 L55 17 L80 4 M69 4 H80 V15&quot; fill=&quot;none&quot; stroke=&quot;#074b78&quot; stroke-width=&quot;2.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&lt;p class=&quot;number&quot;&gt;01 / DEVELOP&lt;/p&gt;&lt;h3&gt;Build on what connects.&lt;/h3&gt;&lt;p&gt;Build on the topics and posts that earn a response. Give customers useful answers rooted in your Brand’s expertise.&lt;/p&gt;&lt;small&gt;Content signals → stronger topics&lt;/small&gt;&lt;/article&gt;&lt;article class=&quot;focus-block&quot;&gt;&lt;svg viewBox=&quot;0 0 100 60&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;68&quot; cy=&quot;29&quot; r=&quot;26&quot; fill=&quot;#edf7fc&quot;/&gt;&lt;rect x=&quot;23&quot; y=&quot;12&quot; width=&quot;40&quot; height=&quot;36&quot; rx=&quot;4&quot; fill=&quot;white&quot; stroke=&quot;#29abe2&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M30 23 H51 M30 31 H45 M70 12 C89 22 86 43 69 49 M69 39 V49 H79&quot; fill=&quot;none&quot; stroke=&quot;#074b78&quot; stroke-width=&quot;2.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&lt;p class=&quot;number&quot;&gt;02 / REFRAME&lt;/p&gt;&lt;h3&gt;Change the approach.&lt;/h3&gt;&lt;p&gt;When a message falls flat, change the angle. Keep the Brand promise intact while making the message more relevant to the audience.&lt;/p&gt;&lt;small&gt;Weaker response → a better approach&lt;/small&gt;&lt;/article&gt;&lt;article class=&quot;focus-block&quot;&gt;&lt;svg viewBox=&quot;0 0 100 60&quot; aria-hidden=&quot;true&quot;&gt;&lt;g fill=&quot;#29abe2&quot;&gt;&lt;rect x=&quot;15&quot; y=&quot;10&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;32&quot; y=&quot;10&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;49&quot; y=&quot;10&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;15&quot; y=&quot;27&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;32&quot; y=&quot;27&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;49&quot; y=&quot;27&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;15&quot; y=&quot;44&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;32&quot; y=&quot;44&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;49&quot; y=&quot;44&quot; width=&quot;11&quot; height=&quot;10&quot; rx=&quot;2&quot;/&gt;&lt;/g&gt;&lt;circle cx=&quot;79&quot; cy=&quot;39&quot; r=&quot;15&quot; fill=&quot;#074b78&quot;/&gt;&lt;path d=&quot;M72 39 H86 M79 32 V46&quot; fill=&quot;none&quot; stroke=&quot;white&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;/svg&gt;&lt;p class=&quot;number&quot;&gt;03 / CREATE&lt;/p&gt;&lt;h3&gt;Give the campaign dimension.&lt;/h3&gt;&lt;p&gt;Connect the Message Matrix to the publishing calendar. Develop related messages with distinct roles across your website, social and email.&lt;/p&gt;&lt;small&gt;Message Matrix → connected direction&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&#10;&lt;section class=&quot;section results-section&quot; id=&quot;results&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;Developed with companies. Refined through practice.&lt;/p&gt;&lt;h2&gt;The framework has&lt;br&gt;worked in the real world.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Westgate’s published consulting examples show the business results behind the approach.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;results-grid&quot;&gt;&lt;article&gt;&lt;p class=&quot;eyebrow&quot;&gt;Consumer products&lt;/p&gt;&lt;strong&gt;287%&lt;/strong&gt;&lt;h3&gt;Sales growth over four years&lt;/h3&gt;&lt;p&gt;An apparel company serving consumer and retail markets.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;p class=&quot;eyebrow&quot;&gt;B2B software&lt;/p&gt;&lt;strong&gt;$2.64M&lt;/strong&gt;&lt;h3&gt;First-quarter sales pipeline growth&lt;/h3&gt;&lt;p&gt;An AI software company serving the oil and gas industry.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;p class=&quot;eyebrow&quot;&gt;Powersports&lt;/p&gt;&lt;strong&gt;47%&lt;/strong&gt;&lt;h3&gt;Sales increase in one year&lt;/h3&gt;&lt;p&gt;A Ducati and Honda dealership, during the pandemic.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;p class=&quot;evidence-note&quot;&gt;Past Westgate consulting results, as published by Westgate Marketing. These examples are not Pro Analytics subscription results or a forecast for your business. &lt;a href=&quot;https://westgatemarketing.net/managed-social-media/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;See the published examples ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&#10;&lt;section class=&quot;section foundation&quot; id=&quot;foundation&quot;&gt;&lt;div class=&quot;wrap foundation-grid&quot;&gt;&lt;div class=&quot;foundation-mark&quot;&gt;&lt;p&gt;THE SOCIAL MEDIA MAGNET&lt;/p&gt;&lt;svg viewBox=&quot;0 0 400 220&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M200 110 C10 -20 10 240 200 110 C390 -20 390 240 200 110&quot; stroke=&quot;#29abe2&quot; stroke-width=&quot;14&quot; fill=&quot;none&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;110&quot; r=&quot;48&quot; fill=&quot;#074b78&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;22&quot; font-weight=&quot;700&quot; fill=&quot;white&quot;&gt;Brand&lt;/text&gt;&lt;/svg&gt;&lt;h3&gt;Brand. Message. Movement.&lt;/h3&gt;&lt;span&gt;A business framework you can put to work.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;foundation-copy&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;Built in business. Taught in universities.&lt;/p&gt;&lt;h2&gt;Learn the thinking.&lt;br&gt;Put it into practice.&lt;/h2&gt;&lt;p&gt;Created by marketing consultant and author J. Elliott Cunningham, the Social Media Magnet grew out of hands-on work with companies and their teams. The framework connects the way a business operates with the way it communicates and serves customers.&lt;/p&gt;&lt;p&gt;It has been taught in universities including Belmont and Penn State. More than 1,000 people have gone through the SMM program.&lt;/p&gt;&lt;p class=&quot;byline&quot;&gt;The book establishes the foundation. Live Campaign helps you apply it. Pro Analytics helps you evaluate the movement and sharpen the message.&lt;/p&gt;&lt;a href=&quot;https://socialmediamagnetpro.com/live-campaign-overview/&quot;&gt;Explore the Live Campaign approach →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&#10;&lt;section class=&quot;cta&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;Your business. Your Brand. Your next move.&lt;/p&gt;&lt;h2&gt;Give your marketing&lt;br&gt;a business purpose.&lt;/h2&gt;&lt;p&gt;Build the campaign you need. See what is connecting. Keep moving your Brand forward.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;a class=&quot;btn light&quot; href=&quot;https://socialmediamagnetpro.com/pro-analytics-overview/&quot;&gt;Explore Pro Analytics &lt;span&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;btn secondary&quot; href=&quot;https://socialmediamagnetpro.com/live-campaign/&quot;&gt;Discover Live Campaign &lt;span&gt;→&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&#10;&#10;&lt;script&gt;&#10;const tabs=[...document.querySelectorAll(&#x27;.demo-tab&#x27;)];function selectTab(tab){tabs.forEach(t=&gt;{const active=t===tab;t.setAttribute(&#x27;aria-selected&#x27;,String(active));t.tabIndex=active?0:-1;document.getElementById(t.getAttribute(&#x27;aria-controls&#x27;)).hidden=!active})}tabs.forEach((tab,i)=&gt;{tab.addEventListener(&#x27;click&#x27;,()=&gt;selectTab(tab));tab.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;ArrowRight&#x27;||e.key===&#x27;ArrowLeft&#x27;){e.preventDefault();const t=tabs[1-i];selectTab(t);t.focus()}})});&#10;const samples={30:{sessions:&#x27;12,000&#x27;,users:&#x27;9,800&#x27;,goals:&#x27;2,160&#x27;,traffic:&#x27;12.0&#x27;,user:&#x27;8.4&#x27;,goal:&#x27;20.0&#x27;,rate:&#x27;18.0&#x27;,eff:&#x27;7.1&#x27;,balance:&#x27;18.0&#x
